[build-system]
requires = ["setuptools>=80.0.0", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "pyfc"
version = "0.1.0"
requires-python = ">=3.13"
authors = [
  { name="Patrik Jelic" },
]
description = "A Python package implementing feedback controllers in C++"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/Patrik-J/PyFC"